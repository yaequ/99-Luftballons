<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111317">
  <title>99 Luftballons – Startseite</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-app">
    <section id="screen-lobby" class="screen active" aria-labelledby="game-title">
      <div class="lobby-backdrop" aria-hidden="true"></div>
      <aside class="home-sidebar" aria-label="Hauptmenü">
        <div class="home-icon pixel-frame"><img src="assets/logo-99-luftballons.png" alt="99 Luftballons" width="571" height="304"></div>
        <details class="home-menu pixel-frame" open>
          <summary>Menü</summary>
          <div class="home-menu__buttons">
            <button class="pixel-btn" type="button">Login</button>
            <button class="pixel-btn" type="button">Highscore</button>
            <button class="pixel-btn" type="button">xxx</button>
          </div>
        </details>
      </aside>
      <div class="lobby-shell pixel-frame">
        <p class="eyebrow">Pixel Tower Defense</p>
        <h1 id="game-title">99 LUFTBALLONS</h1>
        <p class="lobby-copy">Verteidige deine 99 Leben über 30 Runden und greife gleichzeitig die lokale KI an.</p>
        <a href="../game/index.html" class="pixel-btn pixel-btn--primary"><span>▶ Zum Spiel</span><small>Spiel ansehen und anschließend starten</small></a>
        <p id="lobby-status" class="status-message" aria-live="polite">Bereit für den Start.</p>
      </div>
    </section>

  </div>
</body>
</html>
