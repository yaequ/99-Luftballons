name: Deploy to IONOS

on:
  push:
    branches:
      - Dev-Fullstack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Upload website via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'deploy/' \
            --exclude 'tests/' \
            --exclude 'config.local.php' \
            --exclude '.DS_Store' \
            ./ deploy/

      - name: Upload to IONOS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './deploy/*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true

      # The wildcard above intentionally uploads the directory contents, but SFTP
      # wildcards omit dotfiles. Upload Apache's protection rules explicitly.
      - name: Upload Apache protection rules
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './deploy/.htaccess'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true
